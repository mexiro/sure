# Layered on top of compose.yml (a copy of compose.example.yml) so the
# upstream file stays untouched and syncing the fork never conflicts.
# The example file only forwards OpenAI settings, so Anthropic ones are added here.
x-ai-env: &ai_env
  LLM_PROVIDER: ${LLM_PROVIDER:-}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-}
  # Passkeys / Touch ID sign-in, bound to the https://localhost address
  WEBAUTHN_RP_ID: localhost
  WEBAUTHN_ALLOWED_ORIGINS: https://localhost

services:
  web:
    environment:
      <<: *ai_env
    # Reachable only from this Mac, not from other devices on the same Wi-Fi.
    ports: !override
      - "127.0.0.1:${PORT:-3000}:3000"
  worker:
    environment:
      <<: *ai_env

  https:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "127.0.0.1:443:443"
    volumes:
      - ./personal/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on:
      - web
    networks:
      - sure_net

volumes:
  caddy-data:
